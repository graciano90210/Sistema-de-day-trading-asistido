# Variantes de estrategia (fase 3). Cada clave es una variante que el backtester puede correr.
# Horas en ET. Todas usan solo barras RTH de 1 minuto, point-in-time.

orb_5:
  type: orb
  or_minutes: 5               # rango de apertura 09:30–09:35
  direction: with_gap         # with_gap | both | long_only
  stop: or_opposite           # or_opposite (otro extremo del rango) | or_mid
  target_r: 2.0               # objetivo en múltiplos de R; null = mantener hasta el cierre forzado
  min_range_atr: 0.05         # descarta rangos diminutos (en fracción del ATR diario)
  max_range_atr: 1.0          # descarta rangos enormes (riesgo por acción excesivo)
  min_or_bars: 3              # barras mínimas dentro del rango (liquidez)
  last_entry_et: "15:45"

orb_15:
  type: orb
  or_minutes: 15
  direction: with_gap
  stop: or_opposite
  target_r: 2.0
  min_range_atr: 0.05
  max_range_atr: 1.0
  min_or_bars: 8
  last_entry_et: "15:45"

vwap_rev:
  type: vwap_reversion
  k_sigma: 2.0                # desviación mínima respecto al VWAP (en desviaciones estándar de close-VWAP)
  min_bars: 30                # barras mínimas antes de evaluar (sigma estable)
  lookback_extreme: 10        # barras para ubicar el extremo (stop)
  stop_buffer_atr: 0.02       # colchón del stop más allá del extremo (fracción del ATR diario)
  min_rr: 1.0                 # recompensa/riesgo mínima (VWAP como objetivo)
  max_hold_minutes: 60        # stop por tiempo
  first_entry_et: "10:00"
  last_entry_et: "15:00"
  direction: both
  max_trades_per_symbol: 1

# ---------------------------------------------------------------------------
# Ronda 2 — pre-registrada en docs/preregistro_ronda2.md (commit 71bff15). NO modificar.
# ---------------------------------------------------------------------------
h1_orb_sip:                   # H1: universo = stocks in play (top 20 RVOL) — ver runner
  type: orb_stop
  or_minutes: 5
  stop_atr: 0.10
  min_or_bars: 3
  last_entry_et: "15:45"

h2_orb_stop_gappers:          # H2: misma mecánica sobre la watchlist de gappers
  type: orb_stop
  or_minutes: 5
  stop_atr: 0.10
  min_or_bars: 3
  last_entry_et: "15:45"

h3_vwap_wide:                 # H3: VWAP con stops amplios
  type: vwap_reversion
  k_sigma: 2.5
  min_bars: 30
  lookback_extreme: 10
  stop_buffer_atr: 0.25
  min_rr: 1.0
  max_hold_minutes: 90
  first_entry_et: "10:00"
  last_entry_et: "15:00"
  direction: both
  max_trades_per_symbol: 1

# ---------------- Ronda 4 (docs/preregistro_ronda4.md, 2026-11-05) — NO modificar ----------------
p1_flag:                      # P1: bandera alcista/bajista sobre velas de 5 min
  type: flag
  pole_atr: 0.40              # mástil >= 0,40 × ATR14 diario
  max_pole_bars: 6            # mástil de hasta 6 velas (30 min)
  flag_min: 3                 # bandera de 3 a 8 velas
  flag_max: 8
  max_retrace: 0.5            # la bandera no retrocede más del 50% del mástil
  vol_ratio: 0.7              # volumen medio bandera <= 0,7 × volumen medio mástil
  valid_min: 15               # orden stop de entrada válida 15 min
  target_r: 2.0
  max_hold_min: 120
  min_stop_pct: 0.002
  first_decision_et: "10:00"
  last_decision_et: "15:00"

p2_double:                    # P2: doble suelo / doble techo sobre velas de 5 min
  type: double
  pivot_n: 3                  # pivote: extremo frente a 3 velas a cada lado (confirmado 3 velas después)
  min_sep: 4                  # separación entre los dos extremos: 4 a 30 velas
  max_sep: 30
  tol_atr: 0.10               # |L2 − L1| <= 0,10 × ATR14
  depth_atr: 0.25             # cuello − base >= 0,25 × ATR14
  prior_bars: 12              # tendencia previa medida en las 12 velas antes del primer extremo
  valid_min: 30
  target_r: 1.0               # movimiento medido clásico ≈ 1 R
  max_hold_min: 120
  min_stop_pct: 0.002
  first_decision_et: "10:00"
  last_decision_et: "15:00"
