# Risk-manager (fase 5). Reglas no negociables del proyecto, aplicadas a CADA orden antes de pedir confirmación.

risk_per_trade: 0.01          # pérdida máxima si salta el stop = 1% del capital
daily_loss_limit: 0.03        # kill switch: sin nuevas entradas si el PnL del día (realizado + flotante) <= -3%
max_trades_per_day: 5
max_positions: 3
buying_power_mult: 4.0        # nocional total abierto <= 4× capital
max_position_pct: 1.0         # nocional de UNA posición <= 100% del capital (antes del apalancamiento)
min_stop_distance_pct: 0.002  # stop a >= 0,2% del precio (evita stops dentro del ruido/spread)
max_stop_distance_pct: 0.10   # stop a <= 10% del precio
no_entries_last_minutes: 15   # sin entradas en los últimos 15 min de la sesión
no_entries_first_minutes: 0   # opcional: esperar N min tras la apertura
flatten_et: "15:50"           # cierre total antes del final de la sesión
confirm_timeout_s: 60         # la confirmación y/n caduca
max_price_drift_r: 0.25       # se cancela si el precio se movió > 0,25 R entre el ticket y la confirmación

# --- Práctica con el tamaño real (pedido del usuario, 2026-11-05) ---
simulated_capital: 1000       # semana de práctica desde 2026-11-12 (antes $3.000). $10/trade = 1 % (null = capital paper real)
simulated_start: "2026-11-12" # desde esta fecha, el PnL realizado del journal se suma al capital simulado
account_type: cash            # sin margen (< $2.000 en EE. UU.): solo largos, sin apalancamiento, sin regla PDT
pdt_max_day_trades: 3         # máx. day trades en 5 sesiones con capital < $25.000 (FINRA; confirmar con el bróker)
small_margin_mult: 2.0        # poder de compra 2× con capital < $25.000 (el 4× intradía exige ser PDT con $25.000)
enforce_pdt: false            # PRÁCTICA (pedido del usuario 2026-11-05): sin límite PDT; con dinero real → true
daily_profit_target: 40       # $ (autorizado 2026-11-09; 40 desde 2026-11-12, semana con $1.000): al llegar, guard/nube cierran todo y no hay más entradas hoy
daily_loss_usd: 40            # $ (2026-11-10; 40 desde 2026-11-12): kill switch simétrico con la meta; reemplaza al −3 % (sin nuevas entradas)
